[package]
name = "orion-server"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Declarative services runtime — deploy governed REST/Kafka services as JSON workflows, with rate limiting, circuit breakers, versioning, and observability built in"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/Orion"
homepage = "https://goplasmatic.io/orion"
documentation = "https://goplasmatic.github.io/Orion/"
readme = "README.md"
keywords = ["workflow", "runtime", "declarative", "microservices", "jsonlogic"]
categories = ["web-programming", "web-programming::http-server"]
# Allowlist: the crate tarball ships only what `cargo install` needs. Anything
# not listed here (media/, docs/, tests/, deploy/, internal notes) stays out —
# crates.io enforces a 10 MiB upload limit and media/ alone is ~15 MB.
include = [
    "/src/**",
    "/migrations/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "/CHANGELOG.md",
    "/config.toml.example",
]

[[bin]]
name = "orion-server"
path = "src/main.rs"

[lib]
name = "orion"
path = "src/lib.rs"

# The SQLite-backed integration tests are consolidated into a single binary so
# the suite links once instead of ~43 times. New test files go in
# tests/integration/ and are declared as modules in tests/integration/main.rs.
# Four more test binaries exist: `cluster` below, plus the auto-discovered
# tests/storage_postgres.rs, tests/storage_mysql.rs and tests/schema_parity.rs
# (separate binaries because the storage backend is pinned per process by a
# OnceLock; schema_parity sidesteps it entirely via `migrator_for`).
[[test]]
name = "integration"
path = "tests/integration/main.rs"
harness = true

# Multi-node (cluster mode) tests: two AppStates over one Postgres + one
# Redis testcontainer. A separate binary because the storage backend is
# pinned per process (DB_BACKEND OnceLock) and the integration binary pins
# SQLite. Run with: cargo test --test cluster -- --ignored
[[test]]
name = "cluster"
path = "tests/cluster/main.rs"
harness = true

[dependencies]
dataflow-rs = "3.0.2"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "matched-path"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "migrate", "macros", "chrono", "any", "sqlite", "postgres", "mysql"] }
sea-query = { version = "0.32", default-features = false, features = ["derive", "backend-sqlite", "backend-postgres", "backend-mysql", "with-chrono"] }
sea-query-binder = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "with-chrono", "sqlx-any", "sqlx-sqlite", "sqlx-postgres", "sqlx-mysql"] }
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "catch-panic", "compression-gzip"] }
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
clap = { version = "4", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "ansi", "tracing-log", "env-filter", "json"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"
async-trait = "0.1"
datalogic-rs = { version = "5.1", features = ["serde_json"] }
datavalue = { package = "datavalue-rs", version = "0.2.3", features = ["serde_json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
url = "2"
ipnet = "2"
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
governor = { version = "0.10", default-features = false, features = ["dashmap", "std"] }
dashmap = "6"
# Wait-free publication of the ChannelRegistry snapshot: every data-plane
# request reads it, and the only writer stores a finished value (N17).
arc-swap = "1"
tower = { version = "0.5", default-features = false, features = ["util"] }
# ssl-vendored statically links OpenSSL into librdkafka so TLS / SASL_SSL /
# SCRAM work without a system OpenSSL at runtime (kafka.auth support).
rdkafka = { version = "0.39", default-features = false, features = ["cmake-build", "tokio", "ssl-vendored"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }

# External DB connectors
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "dns-resolver"] }
# connection-manager: reconnecting handle — a plain MultiplexedConnection is
# dead for the process lifetime after one Redis restart (proposal D15).
redis = { version = "1.3", default-features = false, features = ["tokio-comp", "aio", "connection-manager"] }
futures = { version = "0.3", default-features = false, features = ["alloc"] }

# TLS support. `rustls` is a direct dependency only so `server::tls` can install
# a process-level CryptoProvider: the graph enables both `rustls/aws-lc-rs`
# (axum-server, reqwest) and `rustls/ring` (mongodb, sqlx), which makes rustls
# refuse to pick one on its own.
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }

# OpenTelemetry
opentelemetry = { version = "0.32", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { version = "0.33", default-features = false }

# TCP socket configuration
socket2 = "0.6"

[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256

[profile.release]
strip = true

# Inherits release optimizations but keeps debug symbols so samply / Instruments
# can resolve function names. Use with `cargo build --profile=profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# cargo-dist uses this profile for release builds
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
# test-util (paused clocks, time::advance) is test-only; feature unification
# gives the in-crate #[cfg(test)] modules access without shipping it in release.
tokio = { version = "1", features = ["test-util"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka", "postgres", "mysql", "mongo", "elastic_search", "redis"] }
# In-process self-signed certificate generation for the TLS tests (no
# external `openssl` CLI dependency).
rcgen = "0.14"
# Pre-main initializer: the one place `std::env::set_var` is sound in a
# multi-threaded test binary (secret_references_test's env:// fixture).
ctor = "0.4"
# Property-based tests: the SQL renderer's value-independence invariant and
# route-matching totality (in-crate #[cfg(test)] modules).
proptest = "1"
