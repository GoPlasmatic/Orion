# Virtual workspace manifest — the packages live under crates/:
# orion-server (the runtime) and orion-cli (the CLI, merged from
# the former GoPlasmatic/Orion-cli repo). `default-members` keeps bare cargo
# commands (`cargo run`, `cargo test`, `cargo build`) pointed at the server,
# matching the pre-workspace muscle memory; CI covers the CLI explicitly with
# `--workspace` / `-p orion-cli`.
[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/orion-server"]

[workspace.package]
# One version for the whole workspace.
#
# The two shared library crates used to carry versions of their own, bumped by
# hand and policed by a CI step, because crates-publish skips a rider whose
# version is already on crates.io — so a rider changed without a bump left the
# published binary resolving the older content. Bumping one meant editing the
# requirement in every dependent, which made the dependent a changed rider
# needing its own bump, which cascaded: four numbers under three rules, and 13
# commits touching rider manifests in 18 days, two of them pure fix-ups.
#
# Lockstep removes the whole mechanism. `orion-server` and `orion-cli` were
# already required to be equal (a bare `vX.Y.Z` tag releases every dist-able
# package sitting at that version); extending that to the riders means a
# release always changes their versions too, so the skip can never fire on a
# rider that changed. Nothing is lost: neither library has ever had a release
# cycle of its own, and no tag names either.
version = "1.4.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/Orion"

# The intra-workspace dependencies, declared once. A path dependency still
# needs a `version` to be publishable, so these are the only other places the
# workspace version is written — and `cargo release` rewrites all three
# together (see RELEASING.md).
[workspace.dependencies]
orion-api = { version = "1.4.0", path = "crates/orion-api" }
orion-client = { version = "1.4.0", path = "crates/orion-client" }

# `cargo release <level|version>` performs a release commit: it rewrites
# `workspace.package.version` and both `workspace.dependencies` requirements,
# then tags. Kept to a bare `vX.Y.Z` tag because that is what release.yml,
# docker-release.yml and crates-publish.yml all match on; publishing stays
# with crates-publish.yml, which is idempotent and knows the rider order.
[workspace.metadata.release]
shared-version = true
tag = true
tag-name = "v{{version}}"
publish = false
push = false

# Profiles are only read from the workspace root — a [profile.*] section in a
# member crate is silently ignored (cargo warns once and moves on), so every
# profile the build relies on must live here.
[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256

[profile.release]
strip = true

# Inherits release optimizations but keeps debug symbols so samply / Instruments
# can resolve function names. Use with `cargo build --profile=profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# cargo-dist uses this profile for release builds
[profile.dist]
inherits = "release"
lto = "thin"
