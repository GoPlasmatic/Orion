# Virtual workspace manifest — the packages live under crates/:
# orion-server (the runtime), the shared library crates (orion-api,
# orion-client, orion-definitions), orion-extension-api (what an edition
# implements against) and orion-plugin-sdk (what a plugin author links
# against; depends on nothing here). `default-members` keeps bare cargo
# commands (`cargo run`, `cargo test`, `cargo build`) pointed at the server,
# matching the pre-workspace muscle memory; CI covers the rest with
# `--workspace`. The CLI and the documentation site live in their own
# repositories (codetiger/Orion-cli, GoPlasmatic/Orion-docs) and depend on
# these crates by tag.
[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/orion-server", "crates/orion-docs-check"]

[workspace.package]
# One version for the whole workspace.
#
# The two shared library crates used to carry versions of their own, bumped by
# hand and policed by a CI step, because crates-publish skips a rider whose
# version is already on crates.io — so a rider changed without a bump left the
# published binary resolving the older content. Bumping one meant editing the
# requirement in every dependent, which made the dependent a changed rider
# needing its own bump, which cascaded: four numbers under three rules, and 13
# commits touching rider manifests in 18 days, two of them pure fix-ups.
#
# Lockstep removes the whole mechanism. `orion-server` and `orion-cli` were
# already required to be equal (a bare `vX.Y.Z` tag releases every dist-able
# package sitting at that version); extending that to the riders means a
# release always changes their versions too, so the skip can never fire on a
# rider that changed. Nothing is lost: neither library has ever had a release
# cycle of its own, and no tag names either.
version = "2.0.0-rc.1"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/GoPlasmatic/Orion"

# The intra-workspace dependencies, declared once. A path dependency still
# needs a `version` to be publishable, so these are the only other places the
# workspace version is written — and `cargo release` rewrites them all
# together (see RELEASING.md).
[workspace.lints.rust]
# No crate needs unsafe outside a few test fixtures that set environment
# variables before main; those allow it where they do it.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"

[workspace.dependencies]
# Exact (`=`) requirements: the library crates promise no semver of their own
# (each lib.rs says so) and ship in lockstep, so a 2.0.0 orion-server must
# never resolve a 2.0.1 orion-runtime. cargo-release rewrites these with the
# workspace version and keeps the operator.
orion-api = { version = "=2.0.0-rc.1", path = "crates/orion-api" }
orion-authoring = { version = "=2.0.0-rc.1", path = "crates/orion-authoring" }
orion-client = { version = "=2.0.0-rc.1", path = "crates/orion-client" }
orion-common = { version = "=2.0.0-rc.1", path = "crates/orion-common" }
orion-engine = { version = "=2.0.0-rc.1", path = "crates/orion-engine" }
orion-plugin-host = { version = "=2.0.0-rc.1", path = "crates/orion-plugin-host" }
orion-runtime = { version = "=2.0.0-rc.1", path = "crates/orion-runtime" }
orion-storage = { version = "=2.0.0-rc.1", path = "crates/orion-storage" }
orion-definitions = { version = "=2.0.0-rc.1", path = "crates/orion-definitions" }
orion-extension-api = { version = "=2.0.0-rc.1", path = "crates/orion-extension-api" }
orion-http = { version = "=2.0.0-rc.1", path = "crates/orion-http" }

# `cargo release <level|version>` performs a release commit: it rewrites
# `workspace.package.version` and every `workspace.dependencies` requirement,
# then tags. Kept to a bare `vX.Y.Z` tag because that is what release.yml,
# docker-release.yml and crates-publish.yml all match on; publishing stays
# with crates-publish.yml, which is idempotent and knows the rider order.
[workspace.metadata.release]
shared-version = true
tag = true
tag-name = "v{{version}}"
publish = false
push = false

# Profiles are only read from the workspace root — a [profile.*] section in a
# member crate is silently ignored (cargo warns once and moves on), so every
# profile the build relies on must live here.
[profile.dev]
split-debuginfo = "unpacked"
codegen-units = 256

[profile.release]
codegen-units = 1
strip = true

# Inherits release optimizations but keeps debug symbols so samply / Instruments
# can resolve function names. Use with `cargo build --profile=profiling`.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

# cargo-dist uses this profile for release builds
[profile.dist]
inherits = "release"
lto = "thin"
