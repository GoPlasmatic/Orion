<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 178" width="760" height="178" role="img" aria-label="Bar chart of workflow throughput (v1.0.0): simple workflow 5,655 requests per second; loaded estate of 12 channels 5,167; complex workflow 5,151.">
  <g font-family="-apple-system,'Segoe UI',system-ui,Helvetica,Arial,sans-serif">
    <text x="0" y="16" font-size="13" font-weight="600" fill="#ffffff">Requests per second — higher is better</text>

    <!-- gridlines (0–8,000) -->
    <g stroke="#2c3138" stroke-width="1">
      <line x1="346" y1="34" x2="346" y2="148"/>
      <line x1="458" y1="34" x2="458" y2="148"/>
      <line x1="570" y1="34" x2="570" y2="148"/>
      <line x1="682" y1="34" x2="682" y2="148"/>
    </g>
    <line x1="234" y1="34" x2="234" y2="148" stroke="#3a414b" stroke-width="1"/>

    <!-- bars: 448px = 8,000 req/s, 4px rounded data-ends -->
    <g fill="#3987e5">
      <path d="M234,40 h313 q4,0 4,4 v10 q0,4 -4,4 h-313 z"/>
      <path d="M234,82 h285 q4,0 4,4 v10 q0,4 -4,4 h-285 z"/>
      <path d="M234,124 h284 q4,0 4,4 v10 q0,4 -4,4 h-284 z"/>
    </g>

    <!-- scenario labels -->
    <g font-size="12.5" fill="#ffffff" text-anchor="end">
      <text x="222" y="53">Simple workflow (1 task)</text>
      <text x="222" y="95">Loaded estate (12 channels)</text>
      <text x="222" y="137">Complex workflow (4 tasks)</text>
    </g>

    <!-- value labels at data ends -->
    <g font-size="12" font-weight="600" fill="#ffffff">
      <text x="559" y="53">5,655</text>
      <text x="531" y="95">5,167</text>
      <text x="530" y="137">5,151</text>
    </g>

    <!-- axis ticks -->
    <g font-size="10.5" fill="#c3c2b7" text-anchor="middle">
      <text x="234" y="163">0</text>
      <text x="346" y="163">2,000</text>
      <text x="458" y="163">4,000</text>
      <text x="570" y="163">6,000</text>
      <text x="682" y="163">8,000</text>
    </g>
  </g>
</svg>
