# Orion HA reference topology (multi-instance-ha B4):
# nginx load balancer → 2× orion (cluster mode) → shared Postgres + Redis.
#
#   export ORION_ADMIN_API_KEYS="$(openssl rand -hex 32)"
#   docker compose -f docker-compose.ha.yml up -d --wait
#   curl http://localhost:8080/health
#
# The stack is a production shape, so it boots with ORION_ENVIRONMENT=production:
# admin auth is enforced (ORION_ADMIN_API_KEYS is required) and CORS
# defaults to no cross-origin access (set ORION_CORS_ALLOWED_ORIGINS to a
# comma-separated origin list for browser dashboards).
#
# Demonstrates the recommended production shape:
#   - storage.auto_migrate=false on the replicas; a one-shot `migrate`
#     service applies migrations before either node boots (A10)
#   - cluster mode on: config changes made through either node propagate,
#     dedup/response-cache/rate-limits are shared via Redis, background
#     jobs single-flight
#   - stop_grace_period > drain + force timeout, so SIGTERM triggers the
#     graceful sequence (readyz → 503, keep serving, then stop) instead of
#     being cut short by SIGKILL (A9)
#
# Rolling-deploy drill: deploy/ha/rolling-drill.sh (zero non-2xx at the LB
# while one node is SIGTERM'd under load).
#
# The image is pinned for reproducibility (override with ORION_VERSION=…).
# To run a locally built image instead, use the build override file — it
# retags the local build so it never clobbers the pinned GHCR tag:
#   docker compose -f docker-compose.ha.yml -f docker-compose.ha.build.yml up -d --wait

x-orion-common: &orion-common
  image: ghcr.io/goplasmatic/orion:${ORION_VERSION:-1.0.0}
  restart: unless-stopped
  stop_grace_period: 45s
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
    interval: 5s
    timeout: 3s
    start_period: 10s
    retries: 3

x-orion-env: &orion-env
  ORION_STORAGE__URL: "postgres://orion:orion@postgres:5432/orion"
  ORION_STORAGE__AUTO_MIGRATE: "false"
  ORION_CLUSTER__ENABLED: "true"
  ORION_CLUSTER__REDIS_URL: "redis://redis:6379"
  ORION_SERVER__SHUTDOWN_DRAIN_SECS: "10"
  ORION_SERVER__SHUTDOWN_FORCE_TIMEOUT_SECS: "20"
  ORION_LOGGING__FORMAT: "json"
  ORION_ENVIRONMENT: "production"
  ORION_ADMIN_AUTH__ENABLED: "true"
  ORION_ADMIN_AUTH__API_KEYS: "${ORION_ADMIN_API_KEYS:?set ORION_ADMIN_API_KEYS (comma-separated admin API keys)}"
  ORION_CORS__ALLOWED_ORIGINS: "${ORION_CORS_ALLOWED_ORIGINS:-}"

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
      POSTGRES_DB: orion
    volumes:
      - orion-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  # One-shot migration job (the compose equivalent of the Helm pre-upgrade
  # hook): replicas never race migrations at boot.
  migrate:
    image: ghcr.io/goplasmatic/orion:${ORION_VERSION:-1.0.0}
    command: ["migrate"]
    environment:
      ORION_STORAGE__URL: "postgres://orion:orion@postgres:5432/orion"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  orion-a:
    <<: *orion-common
    environment:
      <<: *orion-env
      ORION_CLUSTER__INSTANCE_ID: "node-a"

  orion-b:
    <<: *orion-common
    environment:
      <<: *orion-env
      ORION_CLUSTER__INSTANCE_ID: "node-b"

  lb:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/ha/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      orion-a:
        condition: service_healthy
      orion-b:
        condition: service_healthy

volumes:
  orion-pg-data:
