# Local-build override for ha.yml: builds the Orion image
# from this checkout and retags it as orion:local (override with
# ORION_IMAGE=…), so `docker compose build` never overwrites the pinned
# ghcr.io tag with a dev build that a later `up` would silently run.
#
#   docker compose -f deploy/compose/ha.yml -f deploy/compose/ha.build.yml up -d --wait
#
# orion-c only exists under `--profile n3`; its entry here is inert otherwise.
services:
  migrate:
    image: ${ORION_IMAGE:-orion:local}
    build:
      context: ../..
    pull_policy: build

  orion-a:
    image: ${ORION_IMAGE:-orion:local}
    build:
      context: ../..
    pull_policy: build

  orion-b:
    image: ${ORION_IMAGE:-orion:local}
    build:
      context: ../..
    pull_policy: build

  orion-c:
    image: ${ORION_IMAGE:-orion:local}
    build:
      context: ../..
    pull_policy: build
