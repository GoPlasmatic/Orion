# Three-node variant of nginx.conf, mounted by docker-compose.ha.n3.yml.
# Kept as a separate file rather than templated: open-source nginx cannot
# expand an upstream list from the environment, and the benchmark runbook
# (RELEASING.md step 4) needs N=2 and N=3 to be two commands, not an edit.
# Everything except the third server and the retry budget matches nginx.conf —
# change them together.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream orion {
        server orion-a:8080 max_fails=1 fail_timeout=2s;
        server orion-b:8080 max_fails=1 fail_timeout=2s;
        server orion-c:8080 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://orion;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Mask a node dropping out mid-deploy: on connection error or
            # 502/503/504, transparently retry another upstream. Tries match
            # the node count so a request survives two nodes failing at once.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_connect_timeout 1s;
        }
    }
}
