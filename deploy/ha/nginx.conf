# Load balancer for the Orion HA reference topology (docker-compose.ha.yml).
#
# Open-source nginx has no active health checks; the drain design doesn't
# need them: a SIGTERM'd node keeps accepting and serving through its drain
# window (readyz already 503 for LBs that do check), and once it stops
# accepting, passive failure detection plus proxy_next_upstream retries the
# other node — the client never sees the transition.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    upstream orion {
        server orion-a:8080 max_fails=1 fail_timeout=2s;
        server orion-b:8080 max_fails=1 fail_timeout=2s;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://orion;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Mask a node dropping out mid-deploy: on connection error or
            # 502/503/504, transparently retry the other upstream. The
            # connect timeout must be well under client timeouts — it is the
            # worst-case added latency when a node's IP vanishes (container
            # gone) and the connect must expire before failover.
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_connect_timeout 1s;
        }
    }
}
