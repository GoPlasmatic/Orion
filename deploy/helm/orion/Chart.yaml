apiVersion: v2
name: orion
description: >-
  Orion — declarative services runtime. Deploys N replicas in cluster mode
  against a shared Postgres/MySQL and Redis, with a pre-upgrade migration
  Job, graceful rolling deploys, HPA, and PDB.
type: application
version: 1.0.0
appVersion: "1.0.0"
home: https://goplasmatic.io/orion
sources:
  - https://github.com/GoPlasmatic/Orion
keywords:
  - workflow
  - integration
  - runtime
# No email: the project routes contact through GitHub (see SECURITY.md, which
# takes vulnerability reports via private advisories rather than a mailbox).
maintainers:
  - name: Plasmatic
    url: https://github.com/GoPlasmatic
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://goplasmatic.github.io/Orion/
    - name: Chart source
      url: https://github.com/GoPlasmatic/Orion/tree/main/deploy/helm/orion
