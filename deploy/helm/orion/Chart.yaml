apiVersion: v2
name: orion
description: >-
  Orion — declarative services runtime. Deploys one node against a
  Postgres/MySQL (or SQLite), with a pre-upgrade migration Job and graceful
  rolling deploys; with the Orion Ext image, N replicas in cluster mode, HPA
  and PDB.
type: application
version: 2.0.0-rc.1
appVersion: "2.0.0-rc.1"
home: https://goplasmatic.io/orion
sources:
  - https://github.com/GoPlasmatic/Orion
keywords:
  - workflow
  - integration
  - runtime
# No email: the project routes contact through GitHub (see SECURITY.md, which
# takes vulnerability reports via private advisories rather than a mailbox).
maintainers:
  - name: Plasmatic
    url: https://github.com/GoPlasmatic
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://docs.goplasmatic.io/
    - name: Chart source
      url: https://github.com/GoPlasmatic/Orion/tree/main/deploy/helm/orion
