{{- if not .Values.storage.existingSecret }}
# Regular release resource read by the server replicas. It stays a
# release resource on purpose: converting it into a hook would drop it
# from the release manifest, and Helm's first upgrade of an existing
# release would then prune it mid-rollout. The migrate Job, which runs as
# a pre-install/pre-upgrade hook BEFORE this Secret is applied, reads its
# own hook-scoped copy rendered in migrate-job.yaml instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orion.fullname" . }}-storage
  labels:
    {{- include "orion.labels" . | nindent 4 }}
type: Opaque
stringData:
  storage-url: {{ include "orion.storageUrl" . | quote }}
{{- end }}
{{- if and .Values.adminAuth.apiKeys (not .Values.adminAuth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "orion.fullname" . }}-admin-auth
  labels:
    {{- include "orion.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-keys: {{ join "," .Values.adminAuth.apiKeys | quote }}
{{- end }}
