{{- if .Values.tests.enabled }}
# `helm test` hook: runs the binary's own `test-connectivity` subcommand,
# which opens the storage pool, counts pending migrations, and probes the
# Kafka brokers when kafka.enabled. Reads the same storage Secret the
# replicas do, so it also proves the Secret wiring is right.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "orion.fullname" . }}-test-connectivity
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  # Same reason as the Deployment: the `orion` Service exists by test time, so
  # the kubelet would otherwise inject ORION_*-named service-link variables.
  enableServiceLinks: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.podSecurityContext }}
  securityContext:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  containers:
    - name: test-connectivity
      image: {{ include "orion.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      args: ["test-connectivity"]
      env:
        {{- include "orion.env" . | nindent 8 }}
      {{- with .Values.extraEnvFrom }}
      envFrom:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumeMounts:
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
