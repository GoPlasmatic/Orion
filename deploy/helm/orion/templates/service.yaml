apiVersion: v1
kind: Service
metadata:
  name: {{ include "orion.fullname" . }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    # Distinguishes this Service from the devStack postgres Service, which
    # carries the same base labels. The ServiceMonitor selects on it.
    app.kubernetes.io/component: server
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if and .Values.metrics.enabled .Values.metrics.service.enabled }}
    - port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "orion.selectorLabels" . | nindent 4 }}
    # Excludes the devStack postgres pod, which shares the base selector
    # labels with a component value of its own.
    app.kubernetes.io/component: server
