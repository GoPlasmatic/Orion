apiVersion: v1
kind: Service
metadata:
  name: {{ include "orion.fullname" . }}
  labels:
    {{- include "orion.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "orion.selectorLabels" . | nindent 4 }}
    # Excludes the devStack postgres/redis pods, which share the base
    # selector labels with their own component values.
    app.kubernetes.io/component: server
