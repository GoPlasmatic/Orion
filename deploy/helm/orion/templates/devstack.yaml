{{- if .Values.devStack.enabled }}
# ============================================================
# DEV/DEMO ONLY: throwaway single-replica Postgres.
# No persistence tuning, no HA, no backups. Never use in production —
# point storage.url at a managed database instead.
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "orion.fullname" . }}-postgres
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "orion.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: dev-postgres
  template:
    metadata:
      labels:
        {{- include "orion.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: dev-postgres
    spec:
      # The dev pod reads no service links, and leaving them on would put
      # ORION_* names into an image that is not Orion's.
      enableServiceLinks: false
      # Restricted-profile contexts so a devStack install passes PodSecurity
      # `restricted` namespaces. UID/GID 70 is the `postgres` user pinned in
      # the postgres alpine images (the default devStack.postgres.image);
      # started non-root, the image entrypoint skips its root step-down.
      # Adjust when overriding the image (Debian postgres uses 999).
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.devStack.postgres.image }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: POSTGRES_USER
              value: {{ .Values.devStack.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.devStack.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.devStack.postgres.database | quote }}
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.devStack.postgres.user | quote }}]
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "orion.fullname" . }}-postgres
  labels:
    {{- include "orion.labels" . | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
spec:
  ports:
    - port: 5432
  selector:
    {{- include "orion.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: dev-postgres
{{- end }}
