# Prose linter for docs/src (DOCUMENTATION_STANDARD.md §12).
#
# Two layers. `Google` is the published Google developer documentation style
# guide, fetched by `vale sync` — it carries tense, voice, heading case,
# accessibility and a spelling list. `Orion` is this book's own rules: the words
# §6.7 bans, the link text §10.6 requires, and the vocabulary §6.4 holds
# constant.
#
#   vale sync      # once after cloning, and whenever Packages changes
#   vale docs/src
#
# Sentence length (§6.2) is NOT here. Vale segments a Markdown table row into
# one sentence, so a five-column reference table reported a false positive per
# row — 1127 of them across the book. The rule lives in docs/lint.sh instead,
# which already skips tables, fences and headings.
#
# Severity is deliberately mixed, per §12's "start advisory and tighten to
# failing over one quarter". MinAlertLevel rises to `error` at Phase 12.

StylesPath = styles
MinAlertLevel = warning

Packages = Google

Vocab = Orion

[*.md]
BasedOnStyles = Vale, Google, Orion

# ── Google rules the standard settles differently ────────────────────────────

# §6.3 wants sentence case for every heading, which is exactly this rule. It is
# the guard for the ~100 Title Case page titles the rewrite removes.
Google.Headings = error

# §6.8: contractions are allowed in quickstarts, tutorials, guides and concepts
# and banned in reference, parameter tables, error text and warnings. Google
# pushes uniformly the other way. The per-type rule needs a page's declared
# type, which Vale cannot see; docs/lint.sh enforces it.
Google.Contractions = NO

# The house em dash is spaced (` — `), set in a font chosen for it, and used
# 1443 times. §6 says nothing about dash spacing, so the house style stands.
Google.EmDash = NO

# Google's word list collides with Orion's own wire vocabulary: `admin` names an
# API path and an auth section, `ingest` a config section, `disabled` the state
# of a runtime flag, `terminal` a step property. Renaming them in prose would
# make the book disagree with the product.
Google.WordList = NO
Google.WordListCase = NO

# Logical quotation, not American. Orion quotes wire strings constantly, and
# moving a period inside a quoted `"code"` value changes what it says.
Google.Quotes = NO

# Orion.Latin says the same thing and also swaps `via` for `through`.
Google.Latin = NO

# No serial comma. The book has used "routing, guards, versioning and traces"
# consistently since 1.0; Google asks for the other convention and §6 takes no
# side. Consistency is the rule, so the house style stands.
Google.OxfordComma = NO

# §6.7 bans the future tense for *behaviour* ("the server will return"), and
# Orion.FutureTense carries that list. Google.Will bans every "will", which
# takes out the standard's own template lines — "What you will learn" (§5.2)
# and a tutorial's "you will build" framing.
Google.Will = NO

# A colon introducing a label's value (`**How it relates:** Pairs with Orion`)
# or an acronym (`…for every service: TLS, identity, IP policy`) is not a
# sentence continuing in lowercase. Those were most of the hits, so this
# stays visible only below the alert floor.
Google.Colons = suggestion

# The reader's own voice is the standard's device for intent routing ("I want
# to build…", §4.2) and troubleshooting headings ("I've updated the state,
# but…", §5.6). A rule against "I" refuses both.
Google.FirstPerson = NO

# §6.1 names the actor as the machinery ("the engine refuses the record"), which
# reads as passive to a heuristic. §6.1's own rule is the one that applies.
Google.Passive = suggestion

# Wire names, JSON keys and flags outnumber prose acronyms here.
Google.Acronyms = suggestion

# House spelling is Oxford: `-our` endings (behaviour, colour) with `-ize`
# verbs (normalize, serialization, recognize). Vale's own dictionary does not
# know the product's nouns, so only Google's spelling list runs.
Vale.Spelling = NO

# ── The curated retrieval index ──────────────────────────────────────────────
#
# llms.txt is written for a model choosing one page, not for a reader. Its
# entries are index annotations that sit beside a title, so the prose rules
# would fight the format.
[llms.txt]
BasedOnStyles =
