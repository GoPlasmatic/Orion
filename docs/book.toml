[book]
title = "Orion Documentation"
description = "Orion is a declarative services runtime: describe a service as JSON, send it to a running server, and it's live in seconds. Safe enough to let an AI write your services. Fast enough to run them in production."
authors = ["Plasmatic"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail on SUMMARY.md entries with no file instead of fabricating empty
# pages (proposal T25).
create-missing = false

[output.html]
additional-css = ["css/fonts.css", "css/plasmatic.css", "css/custom.css", "css/asciinema-player.css"]
additional-js = ["js/asciinema-player.min.js", "js/extra.js", "js/diagram-loader.js"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GoPlasmatic/Orion"
edit-url-template = "https://github.com/GoPlasmatic/Orion/edit/main/docs/{path}"

# No expand/collapse in the sidebar: the one nested chapter this book has
# (Upgrades → Upgrading to 1.0.0) simply shows. Note this key governs *chapter*
# nesting only — the per-page heading tree mdBook's toc.js injects is separate
# and is hidden in plasmatic.css §13, since the on-page ToC rail on the right
# already carries it.
[output.html.fold]
enable = false
level = 0

# Redirects for every URL the docs 2.0 restructure retired. Keys are absolute
# paths from the site root; values are relative to the redirecting page (the
# site serves under the /Orion/ subpath, so absolute values would escape it).
# Nothing here may be removed: these are the only thing keeping old inbound
# links alive, and docs/lint.sh checks that hard site links resolve to a live
# page or an entry below.
[output.html.redirect]
# Phase 1 — reference estate
"/api/admin.html" = "../reference/admin-api.html"
"/api/data.html" = "../reference/data-api.html"
"/api/data.html#route-resolution" = "../reference/data-api.html#route-resolution"
"/configuration/reference.html" = "../reference/configuration.html"
"/reference/workflows.html#available-operators" = "expressions.html#available-operators"

# Phase 2a — spine, Build with AI, upgrades home
"/tutorials/cli-setup.html" = "../getting-started/install.html"
"/tutorials/mcp-setup.html" = "../ai/mcp-setup.html"
"/tutorials/claude-code.html" = "../ai/claude-code.html"
"/getting-started/prompt-pack.html" = "../ai/prompt-pack.html"
"/getting-started/upgrading.html" = "../operate/upgrading-to-1.0.html"

# Phase 2b — the install split, and the Architecture part dissolving into
# Concepts (characteristics.md is deleted outright; nothing in it survived).
"/tutorials/cli-setup.html#create-your-first-service" = "../getting-started/first-service.html"
"/getting-started/install.html#create-your-first-service" = "first-service.html"
"/architecture/overview.html" = "../concepts/how-orion-works.html"
"/architecture/overview.html#three-primitives" = "../concepts/how-orion-works.html#three-primitives"
"/architecture/overview.html#deployment-topology" = "../concepts/how-orion-works.html#deployment-topology"
"/architecture/overview.html#request-processing-flow" = "../concepts/how-orion-works.html#one-requests-journey"
"/architecture/characteristics.html" = "../concepts/how-orion-works.html"

# Phase 3 — the Operate estate; features/ and topology/ dissolve.
"/features/observability.html" = "../operate/monitoring.html"
"/features/observability.html#health-monitoring" = "../operate/monitoring.html#health-endpoints"
"/features/observability.html#what-to-alert-on" = "../operate/monitoring.html#what-to-alert-on"
"/features/resilience.html" = "../operate/failure-handling.html"
"/features/security.html" = "../operate/security.html"
"/features/scalability.html" = "../operate/cluster.html"
"/features/scalability.html#horizontal-scaling--cluster-mode" = "../operate/cluster.html#what-the-cluster-shares"
"/features/deployability.html" = "../operate/docker.html"
"/features/extensibility.html" = "../reference/connectors.html"
"/features/extensibility.html#connectors" = "../reference/connectors.html"
"/features/extensibility.html#kafka-consumer-configuration" = "../reference/configuration.html#kafka"
"/features/availability.html" = "../concepts/lifecycle.html"
"/features/maintainability.html" = "../operate/backup-restore.html"
"/topology/environments.html" = "../operate/cluster.html"
"/topology/packages.html" = "../concepts/packages.html"
"/topology/kubernetes.html" = "../operate/kubernetes.html"
"/reference/configuration.html#production-checklist" = "../operate/production-checklist.html"
"/reference/admin-api.html#the-orion-server-package-cli" = "../operate/promotion.html"

# Phase 4 — Build and Guides; the Tutorials part dissolves.
"/tutorials/use-cases.html" = "../guides/worked-examples.html"
"/tutorials/use-cases.html#common-workflow-patterns" = "../guides/workflow-patterns.html"
"/tutorials/use-cases.html#ai-workflow--cicd" = "../guides/ci-cd.html"
