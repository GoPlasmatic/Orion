[book]
title = "Orion Documentation"
description = "Orion is a declarative services runtime. Define business logic in a workflow, expose it through a channel, and run it on a consistent production foundation."
authors = ["Plasmatic"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail on SUMMARY.md entries with no file instead of fabricating empty
# pages (proposal T25).
create-missing = false

[output.html]
additional-css = ["css/fonts.css", "css/plasmatic.css", "css/custom.css", "css/asciinema-player.css"]
additional-js = ["js/asciinema-player.min.js", "js/extra.js", "js/diagram-loader.js"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GoPlasmatic/Orion"
# No "1., 2., 3." prefixes in the sidebar. The parts already group the book,
# and the numbers implied a reading order this estate does not have — nobody
# reads the reference section in order. Titles alone are what you scan for.
no-section-label = true

# Collapse the sidebar to its groups, expanding only the branch the reader is
# in. Fold was off while the book was 82 flat chapters; the reference estate is
# now one page per function, per command, per connector type and per config
# section (DOCUMENTATION_STANDARD.md §3.3), and an unfolded sidebar of that size
# is a wall rather than a map.
#
# `level = 1` keeps every part's top level open — the six sections and their
# groups — and folds the pages beneath a group until it is entered.
#
# Note this key governs *chapter* nesting only. The per-page heading tree
# mdBook's toc.js injects is separate and is hidden in plasmatic.css §13, since
# the on-page ToC rail on the right already carries it.
[output.html.fold]
enable = true
level = 1

# No printer icon, and no print.html. That page concatenated all ~90 chapters
# into one document nobody asked for, and browser print still works per page
# (plasmatic.css §20 is what styles it). The right buttons are Home and the
# repo, nothing else.
[output.html.print]
enable = false

# Search, tuned for a 56-chapter reference estate. On the defaults a query for
# a term that IS a chapter title ranked page bodies mentioning it level with
# the page about it, which on a book this size buries the obvious answer.
#
# The two boosts are the whole point: a hit in the page title outranks the same
# hit in a paragraph, and a hit in the heading whose section contains it
# outranks one in unrelated prose. The remaining two only widen the default
# result set — 30 hits and a longer teaser, because reference lookups
# legitimately match many pages and the teaser is how you pick between them.
[output.html.search]
boost-title = 3
boost-hierarchy = 2
limit-results = 30
teaser-word-count = 30

# Redirects for every URL the docs 2.0 restructure retired. Keys are absolute
# paths from the site root; values stay relative to the redirecting page. They
# had to be relative on GitHub Pages, which served the book under a /Orion/
# subpath that an absolute value would have escaped; docs.goplasmatic.io serves
# at the root, so that constraint is gone — but relative values are correct
# under either, and rewriting ~50 of them would buy nothing.
# Nothing here may be removed: these are the only thing keeping old inbound
# links alive, and docs/lint.sh checks that hard site links resolve to a live
# page or an entry below.
[output.html.redirect]
