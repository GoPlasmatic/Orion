# Phase 2a — spine, Build with AI, upgrades home
"/tutorials/cli-setup.html" = "../get-started/install.html"
"/tutorials/mcp-setup.html" = "../guides/ai/agent-skill.html"
"/ai/mcp-setup.html" = "../guides/ai/agent-skill.html"
