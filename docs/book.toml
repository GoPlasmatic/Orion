[book]
title = "Orion Documentation"
description = "Turn business logic into APIs your AI can write and your ops team can trust. Describe a service as JSON, send it to Orion, and it's live in seconds."
authors = ["Plasmatic"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Fail on SUMMARY.md entries with no file instead of fabricating empty
# pages (proposal T25).
create-missing = false

[output.html]
additional-css = ["css/plasmatic.css", "css/custom.css", "css/asciinema-player.css"]
additional-js = ["js/asciinema-player.min.js", "js/extra.js", "js/diagram-loader.js"]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/GoPlasmatic/Orion"
edit-url-template = "https://github.com/GoPlasmatic/Orion/edit/main/docs/{path}"

[output.html.fold]
enable = true
level = 0

# Docs 2.0 restructure (docs-implementation-plan.md §4). Keys are absolute
# paths from the site root; values are relative to the redirecting page (the
# site serves under the /Orion/ subpath, so absolute values would escape it).
[output.html.redirect]
# Phase 1 — reference estate
"/api/admin.html" = "../reference/admin-api.html"
"/api/data.html" = "../reference/data-api.html"
"/api/data.html#route-resolution" = "../reference/data-api.html#route-resolution"
"/configuration/reference.html" = "../reference/configuration.html"
"/reference/workflows.html#available-operators" = "expressions.html#available-operators"

# Phase 2 — spine, Build with AI, upgrades home
"/tutorials/cli-setup.html" = "../getting-started/install.html"
"/tutorials/mcp-setup.html" = "../ai/mcp-setup.html"
"/tutorials/claude-code.html" = "../ai/claude-code.html"
"/getting-started/prompt-pack.html" = "../ai/prompt-pack.html"
"/getting-started/upgrading.html" = "../operate/upgrading-to-1.0.html"
