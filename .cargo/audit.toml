# cargo-audit configuration. deny.toml's [advisories] ignore list is the
# source of truth and is enforced by CI (`cargo deny check`); this file exists
# so a developer's `cargo audit` reaches the same verdict instead of flagging
# an advisory the project has already assessed.

[advisories]
# Empty: the two entries that lived here named `rsa` (via sqlx-mysql) and
# `proc-macro-error2` (via orion-cli's tabled), neither of which is in the
# dependency graph any more. Add a justified entry here only when deny.toml
# gains the same one.
ignore = []
