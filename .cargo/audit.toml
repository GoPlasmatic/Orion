# cargo-audit configuration. deny.toml's [advisories] ignore list is the
# source of truth and is enforced by CI (`cargo deny check`); this file exists
# so a developer's `cargo audit` reaches the same verdict instead of flagging
# an advisory the project has already assessed. Keep the two lists identical.

[advisories]
ignore = [
    # Dev-only testcontainers dependency, unmaintained, no replacement release.
    "RUSTSEC-2026-0440",
    # sqlx-sqlite 0.9.0 pins libsqlite3-sys < 0.38; the fix needs sqlx's bump.
    # Local-file attack only; see deny.toml for the assessment.
    "RUSTSEC-2026-0459",
]
