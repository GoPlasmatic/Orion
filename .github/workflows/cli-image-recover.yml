name: CLI Image Recovery

# One-off recovery: the orion-cli GHCR package is linked to this repository
# from the 1.x monorepo, so GoPlasmatic/Orion-cli's GITHUB_TOKEN cannot push
# to it. This workflow builds the CLI image from its release tag with this
# repository's token, which does have access. Delete after the package is
# relinked to GoPlasmatic/Orion-cli in the package settings.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "CLI version to publish"
        required: true
        default: "2.0.0"
      tag:
        description: "CLI release tag"
        required: true
        default: "v2.0.0"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/goplasmatic/orion-cli

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out the CLI release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: GoPlasmatic/Orion-cli
          ref: ${{ inputs.tag }}
          token: ${{ secrets.GH_PAT }}
          path: cli
          persist-credentials: false

      - name: Resolve the CLI commit
        id: cli
        run: echo "sha=$(git -C cli rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          flavor: |
            latest=auto

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cli
          file: cli/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            GIT_HASH=${{ steps.cli.outputs.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge & Push Manifest
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ inputs.version }}" \
            -t "${{ env.IMAGE }}:$(echo '${{ inputs.version }}' | cut -d. -f1,2)" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Record the published manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ inputs.version }}"
