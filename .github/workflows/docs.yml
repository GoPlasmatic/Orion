name: Deploy Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build mdBook
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Same pinned version as the ci.yml book job — the PR check must
      # exercise the exact mdbook that deploys.
      - name: Install mdBook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Build book
        run: mdbook build docs

      # llms-full.txt: the whole book as one markdown file, in SUMMARY order,
      # served from the site root for LLM/agent consumption (llms.txt is a
      # static file in docs/src and is copied by mdbook build).
      - name: Generate llms-full.txt
        run: |
          {
            echo "# Orion — complete documentation"
            echo "# Generated from the mdBook sources at https://github.com/GoPlasmatic/Orion/tree/main/docs/src"
            grep -oE '\(\./[A-Za-z0-9_./-]+\.md\)' docs/src/SUMMARY.md | tr -d '()' | while read -r p; do
              printf '\n\n---\nsource: %s\n---\n\n' "$p"
              cat "docs/src/${p#./}"
            done
          } > docs/book/llms-full.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
