name: CI

on:
  push:
    # Release branches are included so the tag-time `ci-gate` job can find a
    # successful run at the tag SHA. Without them, cutting a release from a
    # `v*` branch either blocks the release workflows or ships unverified.
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

# One group per PR: superseded pushes cancel the in-flight run — ten jobs
# including two full test suites, a Docker build, and a container matrix.
# Branch pushes (main, release/**, v*) group by COMMIT instead, so no two
# pushes ever share a group and every pushed SHA runs to completion. This
# cannot be done by queueing on a shared ref group: GitHub keeps at most
# one running plus one pending run per group and CANCELS an older pending
# run even with cancel-in-progress false — which would leave a SHA with no
# completed run for the release-time ci-gate lookup to find.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # docs.rs renders this crate whether or not the library is a supported
      # embedding API, and a broken intra-doc link ships as broken there. The
      # lints are warn-by-default and nothing was reading them, so 18 had
      # accumulated by 1.0.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --lib

  # rust-version in Cargo.toml is a public stability promise; this job is
  # the only thing that keeps it honest (proposal T9).
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # Run the suite, not just `cargo check`: the promise is that a
      # contributor on 1.88 can build AND test, which also keeps
      # dev-dependencies honest about the MSRV.
      - name: Test on MSRV
        run: cargo test

  examples:
    name: Examples
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Build
        run: cargo build

      - name: Lint example workflows
        run: |
          for f in examples/*/workflow.json; do
            ./target/debug/orion-server lint "$f"
          done

      - name: Start Postgres (postgres-orders example)
        run: docker compose -f examples/postgres-orders/docker-compose.yml up --wait postgres

      - name: Start Orion
        run: |
          ORION_STORAGE__URL="sqlite:/tmp/orion-examples.db?mode=rwc" \
          ORDERS_DB_URL="postgres://orion:orion@localhost:5432/orion_orders" \
          ./target/debug/orion-server > /tmp/orion-examples.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat /tmp/orion-examples.log >&2
          exit 1

      - name: Quickstart script (twice — idempotency)
        run: |
          ./examples/quickstart.sh
          ./examples/quickstart.sh

      - name: Deploy every example end-to-end (twice — idempotency)
        run: |
          cd examples
          for d in */; do
            [ -f "$d/workflow.json" ] || continue
            ./deploy.sh "${d%/}"
            ./deploy.sh "${d%/}"
          done

      - name: Server log on failure
        if: failure()
        run: cat /tmp/orion-examples.log || true

  # The full default suite on its own job (proposal T8): unit and integration
  # signal must not ride the coverage job, whose hand-rolled swapfile and
  # OOM exposure can wipe all of it at once. Container-gated tests stay in
  # integration-containers.
  test:
    name: Test
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Run tests
        run: cargo test --all-targets

      # --all-targets silently skips doctests; the config structs carry
      # heavily documented examples that would otherwise never compile.
      - name: Run doctests
        run: cargo test --doc

  # Advisories AND license compatibility / bans / source policy over the
  # whole tree (proposal T12) — deny.toml is the policy, including the one
  # documented advisory ignore. Prebuilt binary + registry cache keep it
  # fast; unlike the old `cargo audit` job, warnings-as-configured fail it.
  deny:
    name: Dependency Check (cargo-deny)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  # docs.yml only fires on merges touching docs/**, so without this a PR
  # can break the book (dangling SUMMARY entry, bad include) and nobody
  # notices until after merge. book.toml sets create-missing = false, so a
  # missing SUMMARY target fails the build here instead of fabricating an
  # empty page (proposal T25).
  book:
    name: Book (mdbook)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.2

      - name: Build book
        run: mdbook build docs

  # The image build breaks independently of cargo (system deps like the
  # rdkafka toolchain, base-image drift). Building on every PR keeps that
  # from being discovered mid-release (proposal T10). No push — the release
  # workflow owns publishing; the shared gha cache scope keeps this cheap
  # and warms the release build.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          # Same build-arg the release build passes (.dockerignore excludes
          # .git/), so this job exercises the exact release build shape.
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max

  coverage:
    name: Test Coverage
    runs-on: ubuntu-22.04
    # Non-blocking (proposal T8): pass/fail signal comes from the `test` job;
    # this one only produces the lcov artifact and is allowed to fall over
    # (it needs manual disk-freeing and a swapfile to survive the runner).
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Add swap space
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info -j 2

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: lcov.info

  integration-containers:
    name: Container Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # GitHub-hosted ubuntu runners ship Docker, so testcontainers spins up
      # ephemeral Postgres / MySQL / MongoDB / Elasticsearch / Redis / Kafka
      # containers on demand. The name filters run only the container-backed
      # round-trip + raw-SQL + ES + Redis tests. Filters are substring matches
      # on the full module::test path — every module with #[ignore] tests must
      # appear here by module name, or its tests never run anywhere.
      - name: Run container-backed integration tests
        run: cargo test --test integration -- --ignored data_parity_test data_roundtrip_test postgres_test mysql_test mongodb_test es_test connector_redis_test db_column_types_test dynamic_inputs_test

      # Kafka gets its own step: each test starts its own broker container, and
      # sharing one invocation with the Postgres/MySQL/Mongo/ES containers
      # starves them — producers fail with MessageTimedOut while brokers fight
      # for CPU. Measured on the pre-existing suite (no changes): 4 Kafka
      # failures in the combined run, 13/13 green when Kafka runs on its own.
      # Scheduling pressure, not a defect. If this step is still flaky on a
      # smaller runner, add `--test-threads=2`.
      - name: Kafka container tests
        run: cargo test --test integration -- --ignored kafka_test

      # Orion's own storage on Postgres / MySQL. Separate binaries (one
      # process each) because the storage backend is pinned per process via
      # the DB_BACKEND OnceLock.
      - name: Postgres storage backend tests
        run: cargo test --test storage_postgres -- --ignored

      - name: MySQL storage backend tests
        run: cargo test --test storage_mysql -- --ignored

      # D10: migrate all three backends from scratch and assert the schemas
      # agree — columns and their nullability, normalised types, and every
      # idx_* index with its ordered column list. Only the SQLite half runs
      # without Docker, so on a machine with no daemon this step is the only
      # place the three are compared.
      - name: Schema parity across backends
        run: cargo test --test schema_parity -- --ignored

      # Multi-node cluster-mode tests: two AppStates over one Postgres + one
      # Redis container per test. Serial — each test runs its own containers.
      - name: Cluster mode multi-node tests
        run: cargo test --test cluster -- --ignored --test-threads=1
