name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Lint
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  # rust-version in Cargo.toml is a public stability promise; this job is
  # the only thing that keeps it honest (proposal T9).
  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Check on MSRV
        run: cargo check --all-targets

  examples:
    name: Examples
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Build
        run: cargo build

      - name: Lint example workflows
        run: |
          for f in examples/*/workflow.json; do
            ./target/debug/orion-server lint "$f"
          done

      - name: Start Postgres (postgres-orders example)
        run: docker compose -f examples/postgres-orders/docker-compose.yml up --wait postgres

      - name: Start Orion
        run: |
          ORION_STORAGE__URL="sqlite:/tmp/orion-examples.db?mode=rwc" \
          ORDERS_DB_URL="postgres://orion:orion@localhost:5432/orion_orders" \
          ./target/debug/orion-server > /tmp/orion-examples.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8080/healthz > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "server did not become healthy" >&2
          cat /tmp/orion-examples.log >&2
          exit 1

      - name: Quickstart script (twice — idempotency)
        run: |
          ./examples/quickstart.sh
          ./examples/quickstart.sh

      - name: Deploy every example end-to-end (twice — idempotency)
        run: |
          cd examples
          for d in */; do
            [ -f "$d/workflow.json" ] || continue
            ./deploy.sh "${d%/}"
            ./deploy.sh "${d%/}"
          done

      - name: Server log on failure
        if: failure()
        run: cat /tmp/orion-examples.log || true

  audit:
    name: Security Audit
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run audit
        run: cargo audit

  coverage:
    name: Test Coverage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      - name: Add swap space
        run: |
          sudo swapoff /swapfile || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --lcov --output-path lcov.info -j 2

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: lcov.info

  integration-containers:
    name: Container Integration Tests
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # GitHub-hosted ubuntu runners ship Docker, so testcontainers spins up
      # ephemeral Postgres / MySQL / MongoDB / Elasticsearch / Kafka containers
      # on demand. The name filters run only the container-backed round-trip +
      # raw-SQL + ES + Kafka tests and skip the still-localhost redis test.
      - name: Run container-backed integration tests
        run: cargo test --test integration -- --ignored data_roundtrip_test postgres_test mysql_test mongodb_test es_test kafka_test

      # Orion's own storage on Postgres / MySQL. Separate binaries (one
      # process each) because the storage backend is pinned per process via
      # the DB_BACKEND OnceLock.
      - name: Postgres storage backend tests
        run: cargo test --test storage_postgres -- --ignored

      - name: MySQL storage backend tests
        run: cargo test --test storage_mysql -- --ignored

      # Multi-node cluster-mode tests: two AppStates over one Postgres + one
      # Redis container per test. Serial — each test runs its own containers.
      - name: Cluster mode multi-node tests
        run: cargo test --test cluster -- --ignored --test-threads=1
