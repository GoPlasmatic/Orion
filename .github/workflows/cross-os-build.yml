# macOS and Windows compile checks (proposal T20).
#
# `dist-workspace.toml` ships aarch64-apple-darwin and x86_64-pc-windows-msvc
# binaries, but every CI job runs on ubuntu — so before this workflow, those
# two targets were compiled for the FIRST time when the release tag was
# pushed (`release.yml` gates `build-local-artifacts` off pull requests and
# no `pr-run-mode` is set). A platform-specific compile error — rdkafka's
# cmake + vendored-OpenSSL build and path handling are the usual suspects —
# surfaced mid-release, after the tag existed, with the Homebrew formula
# depending on the macOS build succeeding.
#
# Build only, deliberately: the test suite's container-gated halves need
# Docker, and the unit suite runs twice on ubuntu already. What tag time
# needs from these platforms is a successful compile, so that is what is
# checked — with `--locked`, matching how cargo-dist builds.
#
# A separate workflow rather than a ci.yml job so it can be path-filtered:
# GitHub has no per-job path filter, and most PRs (docs, helm, workflows)
# should not pay for two extra-cost runners. Consequence: this is NOT part
# of the tag-time `ci-gate` lookup, which queries ci.yml runs only — the
# release build itself remains the final proof; this exists to surface the
# breakage weeks earlier.
name: Cross-OS Build

on:
  push:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "src/**"
      - "migrations/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-os-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "migrations/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/cross-os-build.yml"

permissions:
  contents: read

concurrency:
  group: cross-os-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (aarch64-apple-darwin); macos-13 is
        # the last Intel image (x86_64-apple-darwin, added to dist in P13);
        # windows-latest matches x86_64-pc-windows-msvc. cmake is preinstalled
        # on all three runner images (rdkafka's cmake-build needs it);
        # vendored OpenSSL needs no system package.
        os: [macos-latest, macos-13, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked

  # The static-Linux proof (P13). Musl is the audience of the "single binary,
  # no runtime dependencies" pitch (Alpine/distroless/scratch), and rdkafka's
  # cmake + vendored-OpenSSL build is exactly the part with a history of
  # fighting musl — so the target earns its place in dist-workspace.toml by
  # holding this job green, not by assertion. Promote it there once it has.
  musl:
    name: Build (x86_64-unknown-linux-musl)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools cmake

      - name: Build
        run: cargo build --locked --target x86_64-unknown-linux-musl
