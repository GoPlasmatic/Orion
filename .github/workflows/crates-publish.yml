name: Publish to crates.io

permissions:
  contents: read

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # Publishing must not outrun CI (proposal T10).
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-22.04
    # T32: scopes CRATES_IO_TOKEN — a long-lived secret exposed to a job that
    # runs every build script in the dependency tree — behind a GitHub
    # environment. Auto-created unprotected on first run; add reviewers or a
    # branch policy under Settings → Environments to make it a real gate
    # (crates.io Trusted Publishing can replace the token entirely later).
    environment: crates-io
    # Skip prereleases (tags containing alpha, beta, rc, pre)
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'pre') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master (toolchain from `with`)
        with:
          toolchain: "1.100"

      # P14: one dependency list, maintained in the composite action.
      - name: Install system dependencies
        uses: ./.github/actions/apt-build-deps

      # The tag decides whether this job runs at all (a prerelease skips it),
      # but it is not the version cargo will publish: publish-crates.sh reads
      # each manifest. A v2.0.0 tag on a tree still at 2.0.0-rc.1 would
      # therefore publish prerelease content under the release tag. Refuse
      # that before anything reaches the registry. docker-release.yml has the
      # same assertion for the image.
      - name: Verify the tag matches the workspace version
        run: |
          tag_version="${GITHUB_REF_NAME#orion-server-v}"
          tag_version="${tag_version#v}"
          manifest_version="$(.github/scripts/crate-version.sh orion-server)"
          if [ "${tag_version}" != "${manifest_version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the workspace version ${manifest_version}; refusing to publish."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches workspace version ${manifest_version}."

      # orion-server is the one binary crate published here. The CLI lives in
      # its own repository and ships through its installers, not crates.io.
      - name: Determine packages from tag
        id: pkg
        run: |
          # Bare v* and orion-server-v* tags both publish the server.
          packages="orion-server"
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${packages}"

      # The shared library crates (orion-api, orion-client, orion-definitions,
      # orion-extension-api, orion-common, orion-storage, orion-engine,
      # orion-plugin-host, orion-runtime, orion-authoring, orion-http,
      # orion-plugin-sdk) have no
      # release cycle of their own — no tag ever names
      # them. They ride along here:
      # crates.io refuses a crate whose dependency isn't on crates.io, so the
      # server tag that first carries a not-yet-published version publishes it
      # in passing. Each is skipped when its version already exists (see
      # publish-crates.sh for how "already exists" is established), which makes
      # the step idempotent across repeated tags. `cargo publish` blocks until
      # the index has the crate, so each subsequent publish can resolve it
      # immediately. Listed in dependency order: orion-client,
      # orion-extension-api and orion-common depend on orion-api,
      # orion-storage on orion-common, orion-engine on all of those and
      # orion-definitions, orion-plugin-host on orion-engine, orion-runtime on
      # all of them, orion-authoring on orion-runtime, and orion-http on
      # orion-authoring. All eleven are
      # dependencies of orion-server, so they are still required even though the CLI no
      # longer publishes.
      # orion-plugin-sdk depends on none of them and nothing in the workspace
      # depends on it — it is what a plugin author links against — but it shares
      # the version and ships by the same rule.
      #
      # Skip-if-present would be a hazard if a rider could change without its
      # version changing — the binary would publish against older crates.io
      # content while the repo builds the newer local content. It cannot: all
      # crates share `workspace.package.version`, so a release moves every
      # rider's version too. (This used to be a hand-maintained rule with a CI
      # step diffing the rider directories; see RELEASING.md.)
      - name: Publish rider crates (only unpublished versions)
        if: ${{ steps.pkg.outputs.packages != '' }}
        run: .github/scripts/publish-crates.sh orion-api orion-client orion-definitions orion-extension-api orion-common orion-storage orion-engine orion-plugin-host orion-runtime orion-authoring orion-http orion-plugin-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # Same script, same skip-if-present reasoning as the rider step: a re-run
      # of this job, or a tag re-pushed after a downstream pipeline failed,
      # must not fail trying to re-publish a version that is already live and
      # unyankable-in-place. It takes a list (rather than a bare
      # `orion-server`) so that restoring a second publishable package later is
      # a one-line change to the `case` above.
      - name: Publish
        if: ${{ steps.pkg.outputs.packages != '' }}
        run: .github/scripts/publish-crates.sh ${{ steps.pkg.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
