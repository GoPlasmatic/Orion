name: Publish to crates.io

permissions:
  contents: read

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # Publishing must not outrun CI (proposal T10).
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-22.04
    # T32: scopes CRATES_IO_TOKEN — a long-lived secret exposed to a job that
    # runs every build script in the dependency tree — behind a GitHub
    # environment. Auto-created unprotected on first run; add reviewers or a
    # branch policy under Settings → Environments to make it a real gate
    # (crates.io Trusted Publishing can replace the token entirely later).
    environment: crates-io
    # Skip prereleases (tags containing alpha, beta, rc, pre)
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'pre') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (toolchain from `with`)
        with:
          toolchain: "stable"

      # P14: one dependency list, maintained in the composite action.
      - name: Install system dependencies
        uses: ./.github/actions/apt-build-deps

      # Two releasable packages share this repo, but only orion-server is
      # published to crates.io.
      #
      # orion-cli deliberately is NOT, and this is not an oversight to correct:
      # the `orion-cli` name on crates.io was registered in January 2021 by an
      # unrelated project (a Lisp compiler, github.com/wafelack/orion) and is
      # owned by that author's account, not ours. Its three versions are all
      # yanked, but yanking never frees a name — `cargo publish -p orion-cli`
      # would 403 with "not an owner", and it would do so *after* the rider
      # crates and orion-server were already live and unyankable-in-place.
      #
      # Nothing regresses by leaving it out. The CLI has never shipped through
      # crates.io: before the monorepo merge it lived in GoPlasmatic/Orion-cli,
      # which had no crates.io pipeline at all, and its four releases went out
      # via GitHub releases, the cargo-dist installers, the Homebrew tap and
      # ghcr.io/goplasmatic/orion-cli. Those are still its channels, and the
      # install docs already point at `cargo install --git` rather than a bare
      # `cargo install orion-cli` for exactly this reason.
      #
      # Do not add orion-cli here without first securing the name on crates.io.
      - name: Determine packages from tag
        id: pkg
        run: |
          case "${GITHUB_REF_NAME}" in
            orion-cli-*) packages="" ;;              # CLI-only tag: nothing to publish
            *)           packages="orion-server" ;;  # bare v* and orion-server-v*
          esac
          echo "packages=${packages}" >> "$GITHUB_OUTPUT"
          if [ -n "${packages}" ]; then
            echo "Publishing: ${packages}"
          else
            echo "::notice::${GITHUB_REF_NAME} is a CLI-only tag and orion-cli is not published to crates.io — nothing to do."
          fi

      # The shared library crates (orion-api, orion-client) have no release
      # cycle of their own — no tag ever names them. They ride along here:
      # crates.io refuses a crate whose dependency isn't on crates.io, so the
      # server tag that first carries a not-yet-published version publishes it
      # in passing. Each is skipped when its version already exists (see
      # publish-crates.sh for how "already exists" is established), which makes
      # the step idempotent across repeated tags. `cargo publish` blocks until
      # the index has the crate, so each subsequent publish can resolve it
      # immediately. Listed in dependency order: orion-client depends on
      # orion-api. Both are dependencies of orion-server, so they are still
      # required even though the CLI no longer publishes.
      #
      # Skip-if-present would be a hazard if a rider could change without its
      # version changing — the binary would publish against older crates.io
      # content while the repo builds the newer local content. It cannot: all
      # four crates share `workspace.package.version`, so a release moves every
      # rider's version too. (This used to be a hand-maintained rule with a CI
      # step diffing the rider directories; see RELEASING.md.)
      - name: Publish rider crates (only unpublished versions)
        if: ${{ steps.pkg.outputs.packages != '' }}
        run: .github/scripts/publish-crates.sh orion-api orion-client
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

      # Same script, same skip-if-present reasoning as the rider step: a re-run
      # of this job, or a tag re-pushed after a downstream pipeline failed,
      # must not fail trying to re-publish a version that is already live and
      # unyankable-in-place. It takes a list (rather than a bare
      # `orion-server`) so that restoring a second publishable package later is
      # a one-line change to the `case` above.
      - name: Publish
        if: ${{ steps.pkg.outputs.packages != '' }}
        run: .github/scripts/publish-crates.sh ${{ steps.pkg.outputs.packages }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
