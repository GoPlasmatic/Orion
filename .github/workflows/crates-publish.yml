name: Publish to crates.io

permissions:
  contents: read

on:
  push:
    tags:
      - "**[0-9]+.[0-9]+.[0-9]+*"

jobs:
  # Publishing must not outrun CI (proposal T10).
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-gate.yml
    permissions:
      actions: read
      contents: read

  publish:
    name: Publish to crates.io
    needs: ci-gate
    runs-on: ubuntu-22.04
    # Skip prereleases (tags containing alpha, beta, rc, pre)
    if: ${{ !contains(github.ref_name, 'alpha') && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'rc') && !contains(github.ref_name, 'pre') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # P14: one dependency list, maintained in the composite action.
      - name: Install system dependencies
        uses: ./.github/actions/apt-build-deps

      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
