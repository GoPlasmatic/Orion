# Reusable gate: release workflows call this to require a successful CI run
# for the commit being released (proposal T10). Tags can otherwise outrun CI
# entirely — a build break would be discovered mid-release.
name: CI Gate

on:
  workflow_call:
    inputs:
      skip:
        description: "Skip the gate (dry runs)"
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify CI passed for this commit
    runs-on: ubuntu-22.04
    steps:
      - name: Check for a successful CI run on this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SKIP: ${{ inputs.skip }}
        run: |
          if [ "$SKIP" = "true" ]; then
            echo "Gate skipped (dry run)."
            exit 0
          fi
          # T28: `event=push` so a pull_request run on the same SHA cannot
          # satisfy a gate that is about what landed on the branch.
          runs() {
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/$1/runs?head_sha=${GITHUB_SHA}&status=completed&event=push" \
              --jq "$2"
          }
          successes=$(runs ci.yml '[.workflow_runs[] | select(.conclusion == "success")] | length')
          if [ "${successes}" = "0" ]; then
            echo "::error::No successful CI push run found for ${GITHUB_SHA}. Let CI pass on this commit before releasing."
            exit 1
          fi
          echo "CI passed for ${GITHUB_SHA} (${successes} successful run(s))."

          # T28: the path-filtered workflows may legitimately have no run for
          # this SHA (a docs-only commit skips them) — but a run that exists
          # with zero successes is a known break the tag must not outrun:
          # cross-os-build is the macOS compile the Homebrew formula depends
          # on. "Some runs, none successful" fails; "no runs" passes.
          for wf in cross-os-build.yml codeql.yml ha-drill.yml; do
            total=$(runs "$wf" '.workflow_runs | length')
            ok=$(runs "$wf" '[.workflow_runs[] | select(.conclusion == "success")] | length')
            if [ "${total}" != "0" ] && [ "${ok}" = "0" ]; then
              echo "::error::${wf} ran for ${GITHUB_SHA} and did not succeed. Fix or re-run it before releasing."
              exit 1
            fi
            echo "${wf}: ${ok}/${total} successful run(s)."
          done
