name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to pick up new query-pack releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # rdkafka (cmake-build feature) and the full dependency graph are heavy;
      # reclaim space WITHOUT deleting the CodeQL toolcache.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force || true

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The Rust extractor is buildless, but it still runs build scripts and
      # compiles proc-macros while resolving the crate graph. cmake + libcurl
      # let rdkafka's cmake-build feature succeed, so the kafka/queue path
      # resolves instead of extracting only partially.
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libcurl4-openssl-dev

      # Warm the dependency cache so extraction resolves the full graph reliably.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: rust
          # Rust only supports buildless extraction; the extractor resolves
          # dependencies itself via cargo.
          build-mode: none
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:rust"
