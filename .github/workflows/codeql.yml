name: CodeQL

on:
  push:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to pick up new query-pack releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # rdkafka (cmake-build feature) and the full dependency graph are heavy;
      # reclaim space WITHOUT deleting the CodeQL toolcache.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force || true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master (toolchain from `with`)
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The Rust extractor is buildless, but it still runs build scripts and
      # compiles proc-macros while resolving the crate graph. The rdkafka
      # system deps let the kafka/queue path resolve instead of extracting
      # only partially (P14: one list, in the composite action).
      - name: Install system dependencies
        uses: ./.github/actions/apt-build-deps

      # Warm the dependency cache so extraction resolves the full graph reliably.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: rust
          # Rust only supports buildless extraction; the extractor resolves
          # dependencies itself via cargo.
          build-mode: none
          queries: security-extended
          # The integration/cluster/e2e test trees are fixtures — canned
          # secrets and "assert the secret is NOT in the output" messages —
          # not shipped code. (Inline `#[cfg(test)]` modules cannot be
          # excluded by path; those alerts are dismissed as "used in tests".)
          config: |
            paths-ignore:
              - crates/*/tests
              - tests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:rust"
