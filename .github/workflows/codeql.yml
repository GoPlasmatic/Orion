name: CodeQL

on:
  push:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
  schedule:
    # Weekly full scan (Mondays 06:00 UTC) to pick up new query-pack releases.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  analyze:
    name: Analyze (rust)
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      # rdkafka (cmake-build feature) and the full dependency graph are heavy;
      # reclaim space WITHOUT deleting the CodeQL toolcache.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo docker image prune --all --force || true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master (toolchain from `with`)
        with:
          toolchain: "stable"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # The Rust extractor is buildless, but it still runs build scripts and
      # compiles proc-macros while resolving the crate graph. The rdkafka
      # system deps let the kafka/queue path resolve instead of extracting
      # only partially (P14: one list, in the composite action).
      - name: Install system dependencies
        uses: ./.github/actions/apt-build-deps

      # Warm the dependency cache so extraction resolves the full graph reliably.
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: rust
          # Rust only supports buildless extraction; the extractor resolves
          # dependencies itself via cargo.
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          category: "/language:rust"
