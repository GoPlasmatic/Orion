name: Docker Release

permissions:
  contents: read
  packages: write

on:
  # Server release tags only: bare v* (the pre-monorepo format) or the
  # package-prefixed form. orion-cli-v* tags are docker-release-cli.yml's.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "orion-server-v[0-9]+.[0-9]+.[0-9]+*"
  # Allow manual trigger with options
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build but don't push)"
        type: boolean
        default: false
      tag_override:
        description: "Version tag override (e.g. 0.1.0)"
        type: string
        required: false

env:
  GHCR_IMAGE: ghcr.io/goplasmatic/orion

jobs:
  # Releases must not outrun CI (proposal T10): the tagged commit needs a
  # successful CI run before anything is built or pushed.
  ci-gate:
    name: CI Gate
    uses: ./.github/workflows/ci-gate.yml
    with:
      skip: ${{ inputs.dry_run || false }}
    permissions:
      actions: read
      contents: read

  # Determine version once, share across jobs
  prepare:
    name: Prepare
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        env:
          TAG_OVERRIDE: ${{ inputs.tag_override }}
        run: |
          RELEASE=1
          if [ -n "${TAG_OVERRIDE}" ]; then
            VERSION="${TAG_OVERRIDE}"
            # P19: the override rides the same `type=semver` metadata path as
            # a tag — an unparseable value is dropped by metadata-action,
            # leaving the merge job's `imagetools create` with zero -t flags
            # after the per-arch digests already pushed. (A tag's shape is
            # constrained by the `on: push: tags` pattern instead.)
            if ! printf '%s' "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
              echo "::error::tag_override '${VERSION}' is not a semver version — metadata-action would drop it and the merge job would fail with untagged images already pushed."
              exit 1
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#orion-server-}"
            VERSION="${VERSION#v}"
          else
            # P19: must parse as semver — `type=semver` in metadata-action
            # drops an unparseable value, leaving `imagetools create` with
            # zero -t flags. A prerelease version also keeps `latest=auto`
            # from tagging `latest` on a rehearsal.
            VERSION="0.0.0-dev.${GITHUB_SHA::8}"
            RELEASE=0
          fi
          # P19: dist refuses a tag that disagrees with the workspace
          # version; this workflow used to stamp whatever the tag (or the
          # dispatch override) said onto image tags, OCI labels and the Helm
          # chart. One refusal for both release paths, so they cannot drift.
          if [ "${RELEASE}" = "1" ]; then
            CARGO_VERSION=$(grep -m1 '^version = ' crates/orion-server/Cargo.toml | cut -d'"' -f2)
            if [ "${VERSION}" != "${CARGO_VERSION}" ]; then
              echo "::error::Release version says ${VERSION} but Cargo.toml says ${CARGO_VERSION} — the image would be labelled with a version the binary does not report. Release from a ref whose Cargo.toml agrees."
              exit 1
            fi
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

  # Build per-platform images natively in parallel
  build:
    name: Build (${{ matrix.platform }})
    needs: [prepare, ci-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-22.04
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=sha,prefix=
          flavor: |
            latest=auto

      # Build and push by digest (no tag yet — tags are applied in the merge step)
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ !inputs.dry_run }}
          # .dockerignore excludes .git/, so the SHA must ride in as a
          # build-arg or every published image reports git_hash=unknown.
          build-args: |
            GIT_HASH=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.platform }},mode=max
          outputs: type=image,name=${{ env.GHCR_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ !inputs.dry_run }}

      - name: Export digest
        if: ${{ !inputs.dry_run }}
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.runner }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Merge platform images into a multi-arch manifest, then sign and attest
  # THAT manifest (proposal P12). The per-platform builds push by digest and
  # are merged with `imagetools create`, and buildx-level provenance/sbom
  # attestations do not reliably survive that merge — attaching them at
  # build-push time can produce a release that looks signed with nothing
  # verifiable on the published tag. So everything verifiable is attached to
  # the final merged manifest digest, which is registry-level and
  # merge-independent:
  #
  #   cosign verify ghcr.io/goplasmatic/orion:<tag> \
  #     --certificate-identity-regexp 'github.com/GoPlasmatic/Orion' \
  #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
  #   gh attestation verify oci://ghcr.io/goplasmatic/orion:<tag> -R GoPlasmatic/Orion
  merge:
    name: Merge & Push Manifest
    needs: [prepare, build]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
      # Keyless signing (cosign) and the provenance attestation both
      # authenticate as the workflow via the OIDC token.
      id-token: write
      attestations: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.GHCR_IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.version }}
            type=sha,prefix=
          flavor: |
            latest=auto

      - name: Create and push multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          docker buildx imagetools inspect "${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}"

      # The digest of the multi-arch manifest list just pushed — the one
      # thing every tag above points at, and therefore the subject every
      # signature and attestation below is bound to.
      - name: Resolve merged manifest digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect \
            "${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}" \
            --format '{{ json .Manifest }}' | jq -r '.digest')
          test -n "${DIGEST}" && [ "${DIGEST}" != "null" ]
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Merged manifest digest: ${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the manifest (keyless)
        run: cosign sign --yes "${{ env.GHCR_IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: ${{ env.GHCR_IMAGE }}@${{ steps.digest.outputs.digest }}
          format: spdx-json
          output-file: /tmp/orion-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach SBOM attestation
        run: |
          cosign attest --yes --type spdxjson \
            --predicate /tmp/orion-sbom.spdx.json \
            "${{ env.GHCR_IMAGE }}@${{ steps.digest.outputs.digest }}"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      # Trust, then verify — in the same run that published. This is the
      # check P12 insists on: what is attached to the tag, not what the
      # workflow diff claims. Fails the release if the signature or the
      # provenance did not actually land on the manifest.
      - name: Verify what is attached to the published tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cosign verify "${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}" \
            --certificate-identity-regexp 'github.com/GoPlasmatic/Orion' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          gh attestation verify \
            "oci://${{ env.GHCR_IMAGE }}:${{ needs.prepare.outputs.version }}" \
            -R "${GITHUB_REPOSITORY}"

  # Publish the Helm chart to GHCR as an OCI artifact (proposal T13): before
  # this job the chart existed only in-tree, so installing it meant cloning
  # the repo. Runs after the manifest merge so a published chart can never
  # point at an image tag that does not exist yet. The chart and app version
  # are both stamped from the release version — the in-tree Chart.yaml value
  # is a development placeholder.
  helm-publish:
    name: Publish Helm Chart
    needs: [prepare, merge]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Package and push
        run: |
          helm package deploy/helm/orion \
            --version "${{ needs.prepare.outputs.version }}" \
            --app-version "${{ needs.prepare.outputs.version }}" \
            --destination /tmp/chart
          helm push /tmp/chart/orion-${{ needs.prepare.outputs.version }}.tgz \
            oci://ghcr.io/goplasmatic/charts
