# Zero-downtime rolling drill (proposal T14).
#
# deploy/ha/rolling-drill.sh is the executable form of a headline 1.0 claim:
# SIGTERM one of two replicas under steady load through the nginx LB and
# observe ZERO non-2xx responses. Before this workflow it was self-asserting
# but never asserted — no automation ran it, so the claim rested on a script
# that could bit-rot silently.
#
# Path-filtered to the pieces the drill actually exercises, plus a weekly
# tick: the graceful-shutdown behaviour lives in src/, but running a full
# image build + stack + drill on every src change would double CI cost for a
# property that changes rarely — the cron catches binary drift within a week,
# and shutdown behaviour itself is pinned per-PR by the shutdown/drain
# integration tests.
name: HA Rolling Drill

on:
  push:
    branches: [main, "release/**", "v[0-9]+.[0-9]+.[0-9]+"]
    paths:
      - "deploy/ha/**"
      - "docker-compose.ha.yml"
      - "docker-compose.ha.build.yml"
      - "Dockerfile"
      - ".github/workflows/ha-drill.yml"
  pull_request:
    paths:
      - "deploy/ha/**"
      - "docker-compose.ha.yml"
      - "docker-compose.ha.build.yml"
      - "Dockerfile"
      - ".github/workflows/ha-drill.yml"
  schedule:
    # Weekly, Monday 04:17 UTC — off the busy hours, and odd-minuted so it
    # does not pile onto GitHub's on-the-hour thundering herd.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ha-drill-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drill:
    name: Rolling deploy, zero non-2xx
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Same cache scope as ci.yml's docker-build job, so this usually costs
      # a cache load rather than a cold cargo build.
      - name: Build the Orion image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: orion:local
          build-args: |
            GIT_HASH=${{ github.sha }}
          cache-from: type=gha,scope=linux/amd64
          cache-to: type=gha,scope=linux/amd64,mode=max

      - name: Start the HA stack (local image)
        env:
          ORION_ADMIN_API_KEYS: drill-only-throwaway-admin-key
        run: |
          docker compose -f docker-compose.ha.yml -f docker-compose.ha.build.yml \
            up -d --wait --no-build

      - name: Run the drill
        run: deploy/ha/rolling-drill.sh

      - name: Stack logs on failure
        if: failure()
        env:
          ORION_ADMIN_API_KEYS: drill-only-throwaway-admin-key
        run: docker compose -f docker-compose.ha.yml logs --tail 200

      - name: Tear down
        if: always()
        env:
          ORION_ADMIN_API_KEYS: drill-only-throwaway-admin-key
        run: docker compose -f docker-compose.ha.yml down -v
