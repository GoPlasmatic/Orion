# Dependency version updates (proposal T17) — the automation SECURITY.md
# points at. Weekly, grouped so routine bumps arrive as one PR per
# ecosystem instead of a PR per crate; majors stay separate because they
# need human review (MSRV, breaking APIs).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"

  # Two Dockerfiles, two entries. Docker updates are per-directory, so the
  # root entry only ever sees the server image — the CLI's Dockerfile arrived
  # with the monorepo restructure and was silently unwatched, which would have
  # shown up the first time the root image took a base bump and this one did
  # not follow. They currently share a base; nothing enforces that, so each
  # gets its own watch rather than an assumption.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: docker
    directory: /crates/orion-cli
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: npm
    directory: /docs/recordings/ui
    schedule:
      interval: weekly
      day: monday
    groups:
      recording-harness:
        update-types:
          - minor
          - patch
