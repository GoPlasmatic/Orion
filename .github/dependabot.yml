# Dependency version updates (proposal T17) — the automation SECURITY.md
# points at. Weekly, grouped so routine bumps arrive as one PR per
# ecosystem instead of a PR per crate; majors stay separate because they
# need human review (MSRV, breaking APIs).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - "*"
