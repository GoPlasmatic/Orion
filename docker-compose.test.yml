# Docker Compose for Orion external service integration tests.
#
# NOTE: Postgres, MySQL, MongoDB, and Elasticsearch are now managed
# automatically by testcontainers inside the tests themselves (see
# tests/integration/common/backends.rs) — you no longer need to start them
# here. This file remains only for services still addressed over a fixed
# localhost port (Redis).
#
# Usage:
#   docker compose -f docker-compose.test.yml up -d          # Start services
#   docker compose -f docker-compose.test.yml down            # Stop and remove
#
# Once services are healthy, run the ignored tests (Docker required):
#   cargo test --test integration -- --ignored

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
