[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# Allow customized CI files (e.g. Homebrew git user/email, GH_PAT secret)
allow-dirty = ["ci"]
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# x86_64-apple-darwin: Intel Macs got nothing before (P13) — the Homebrew
# formula covered Apple Silicon only. Musl (static Linux) is deliberately NOT
# here yet: rdkafka's cmake + vendored-OpenSSL build is the risk, and
# cross-os-build.yml now compiles x86_64-unknown-linux-musl on every relevant
# PR — promote it into this list once that job has a green history.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Homebrew tap repository
tap = "GoPlasmatic/homebrew-tap"
# Attest dist artifacts with GitHub build provenance (proposal P12). The
# committed release.yml carries the matching hand-edits (allow-dirty = ["ci"]
# means dist does not regenerate it); keep this flag so a future regen
# preserves them.
github-attestations = true

# System dependencies for rdkafka-sys (librdkafka built from source via cmake)
[dist.dependencies.apt]
cmake = "*"
"g++" = "*"
pkg-config = "*"
libcurl4-openssl-dev = "*"

[dist.dependencies.homebrew]
cmake = "*"
