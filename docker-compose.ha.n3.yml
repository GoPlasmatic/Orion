# Third-node overlay for the HA reference topology. orion-c inherits the
# shared settings from the base service. Add the n3 build override locally.
#
#   docker compose -f docker-compose.ha.yml -f docker-compose.ha.n3.yml \
#     -f docker-compose.ha.build.yml -f docker-compose.ha.n3.build.yml up -d --wait
#
# For published images, omit both build overrides and set ORION_VERSION.
services:
  orion-c:
    extends:
      file: docker-compose.ha.yml
      service: orion-b
    environment:
      ORION_CLUSTER__INSTANCE_ID: "node-c"

  lb:
    volumes:
      - ./deploy/ha/nginx.n3.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      orion-c:
        condition: service_healthy
