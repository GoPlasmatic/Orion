[package]
name = "orion-cli"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "CLI and MCP server for the Orion declarative services runtime — manage workflows, channels, connectors, data, and traces from the terminal or an AI client"
license.workspace = true
repository.workspace = true
homepage = "https://goplasmatic.github.io/Orion/"
keywords = ["mcp", "cli", "workflow", "microservices", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orion-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
tabled = "0.20"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# Same specs as orion-server so the shared lockfile carries one `toml` and
# one `reqwest` tree instead of a major-version pair each.
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1"
rmcp = { version = "1.4", features = ["server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tokio-util = "0.7"
