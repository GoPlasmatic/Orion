[package]
name = "orion-cli"
# Versioned in lockstep with the rest of the workspace: a bare `vX.Y.Z` tag
# announces every dist-able package at that version, so one tag puts the server
# and the CLI in one release, with one set of installers and one tap push. The
# package-prefixed `orion-cli-vX.Y.Z` tag still works for an out-of-band CLI
# patch between server releases — pin a version here to cut one.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Command-line client for the Orion declarative services runtime"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
keywords = ["cli", "workflow", "microservices", "devops", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "orion-cli"
path = "src/main.rs"


[lints]
workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
colored = "3"
tabled = "0.22"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2", default-features = false, features = ["serialize"] }
# The shared wire contract: the error envelope, status vocabulary and import
# report this CLI reads are the same types the server serializes.
orion-api.workspace = true
# The shared transport — the same client the server's `package` subcommand
# drives. This crate owns reqwest; the CLI has no direct HTTP dependency.
orion-client.workspace = true
# Same spec as orion-server so the shared lockfile carries one `toml` tree.
# (reqwest reaches this binary only through orion-client now.)
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
# Plugin uploads: the component travels as base64 inside the JSON body.
base64 = "0.23"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
# Cancellation for the benchmark runner's Ctrl-C handling.
tokio-util = "0.7"
# The offline authoring tools (lint, compile, dry-run, test, fmt, clippy,
# sql check, plugin signing) run the definition checks, the engine and the
# plugin sandbox in-process, so this binary links them — the same crates the
# server is built from, at the same requirements, so the lockfile carries one
# copy of each.
orion-authoring.workspace = true
orion-common.workspace = true
orion-definitions.workspace = true
orion-engine.workspace = true
orion-plugin-host.workspace = true
orion-runtime.workspace = true
orion-storage.workspace = true
dataflow-rs = { version = "4.0.1", features = ["datetime", "budget"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "migrate", "macros", "chrono", "uuid", "json", "bigdecimal", "sqlite", "postgres", "mysql"] }
similar = "3"

[dev-dependencies]
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
# `sql check` against real databases (the #[ignore]d half of sql_check_test,
# run by the containers CI job). Same requirements as orion-server's.
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15", features = ["postgres", "mysql"] }
