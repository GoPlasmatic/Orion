# An Orion server with the CLI alongside it, for driving the admin API from a
# container instead of a local install.
#
#   docker compose up -d orion
#   docker compose run --rm orion-cli health
#   docker compose run --rm orion-cli workflows list
#
# `orion-cli` sits behind a profile so `docker compose up` starts the server
# only — the CLI is a one-shot command, not a long-running service.
services:
  orion-cli:
    image: ghcr.io/goplasmatic/orion-cli:latest
    profiles: ["cli"]
    environment:
      ORION_SERVER_URL: "http://orion:8080"
      # ORION_API_KEY: "your-secret-key"   # if admin auth is enabled
    depends_on:
      orion:
        condition: service_healthy

  orion:
    image: ghcr.io/goplasmatic/orion:latest
    ports:
      - "8080:8080"
    environment:
      ORION_STORAGE__URL: "sqlite:/app/data/orion.db"
      ORION_LOGGING__FORMAT: "pretty"
    volumes:
      - orion-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  orion-data:
