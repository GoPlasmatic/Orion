[package]
name = "orion-http"
# No release cycle of its own: no tag names this crate. crates-publish.yml
# publishes it as a rider before the crates that depend on it, on the
# workspace's version.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The Orion runtime's HTTP layer: the axum router, the admin and data routes, middleware, TLS serving and the OpenAPI document"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
readme = "README.md"
keywords = ["workflow", "runtime", "http", "axum"]
categories = ["web-programming::http-server"]
include = ["src/**", "README.md"]

[lints]
workspace = true

# The same requirements orion-server states, so the lockfile carries one copy
# of each.
[dependencies]
orion-api = { workspace = true, features = ["utoipa"] }
orion-authoring.workspace = true
orion-common.workspace = true
orion-engine.workspace = true
orion-plugin-host.workspace = true
orion-runtime.workspace = true
orion-storage.workspace = true
dataflow-rs = { version = "4.0.1", features = ["datetime", "budget"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "tracing", "matched-path", "multipart"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "migrate", "macros", "chrono", "uuid", "json", "bigdecimal", "sqlite", "postgres", "mysql"] }
tower-http = { version = "0.7", features = ["trace", "cors", "request-id", "catch-panic", "compression-gzip"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
ipnet = "2"
sha2 = "0.11"
hex = "0.4"
base64 = "0.23"
tower = { version = "0.5", default-features = false, features = ["util"] }
utoipa = { version = "6", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "10", features = ["axum"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["rt-tokio", "trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }
socket2 = "0.6"

[dev-dependencies]
orion-common = { workspace = true, features = ["test-support"] }
orion-engine = { workspace = true, features = ["test-support"] }
orion-runtime = { workspace = true, features = ["test-support"] }
orion-storage = { workspace = true, features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
