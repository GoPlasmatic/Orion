[package]
name = "orion-client"
# Same rider policy as orion-api: no release cycle of its own, no tag ever
# names it, and its version is the workspace's — see the note on
# `workspace.package.version`.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "HTTP client for the Orion declarative services runtime admin and data APIs — the one transport shared by orion-cli and the server's package promotion CLI"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
readme = "README.md"
keywords = ["workflow", "runtime", "api", "client"]
categories = ["api-bindings", "web-programming::http-client"]

[dependencies]
orion-api.workspace = true
# Already in the tree via reqwest — direct so `execute` can hand back the
# response body without copying it out of reqwest's own buffer.
bytes = "1"
# Already in the tree via reqwest/url — direct so `query_string` can encode.
percent-encoding = "2"
# Same spec as the binaries so the shared lockfile carries one reqwest tree.
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }
