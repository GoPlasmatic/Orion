[package]
name = "orion-api"
# No release cycle of its own: no tag names this crate and nothing installs it
# directly. crates-publish.yml publishes it as a *rider* — automatically, right
# before a binary crate whose tag shipped a version of it that isn't on
# crates.io yet (crates.io refuses a crate whose dependency it doesn't host).
#
# The version is the workspace's, which is what makes that safe: a release
# always moves it, so the rider's skip-if-present can never fire on a version
# whose contents changed. It used to be bumped by hand and policed by a CI
# diff — see the note on `workspace.package.version`.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Wire contract for the Orion declarative services runtime — the response DTOs, domain enums, error envelope, and import report shared by orion-server and orion-cli"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
readme = "README.md"
keywords = ["workflow", "runtime", "api", "types"]
categories = ["api-bindings", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
utoipa = { version = "5", features = ["chrono"], optional = true }

[features]
# The server enables this to publish the shared types in its OpenAPI document.
# Clients (orion-cli) leave it off and pay for none of utoipa.
utoipa = ["dep:utoipa"]
