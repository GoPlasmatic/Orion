# The guest half of the plugin runtime tests: one component exporting the
# `orion:plugin` world whose functions misbehave on request — trap, spin,
# allocate without end, return the wrong shape. Built for
# wasm32-unknown-unknown (no WASI, so the component imports nothing) and
# turned into a component by `wasm-tools`; see build.sh. The built bytes are
# committed beside this crate so `cargo test` needs no wasm toolchain.
[package]
name = "orion-fixture-plugin"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.57"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
codegen-units = 1
strip = true

# Its own workspace, so cargo does not try to fold it into the server's.
[workspace]
