# The fixture as an upload: the functions that answer a probe. The full
# manifest beside this one also declares `trap`, `spin` and `alloc-forever`,
# which fail the self-test every upload runs — by design, and the runtime
# tests build their handlers directly. Anything uploaded through the API,
# in a test or over the CLI, uses this manifest.
abi = "orion:plugin@1.0.0"
name = "test.fixture"
version = "0.0.0"
component = "fixture.wasm"

[[functions]]
name = "test.fixture.identity"
description = "Return the input unchanged"
output_default_root = "data"

[[functions.input_fields]]
name = "message"
kind = "any"
required = true
resolvable = true

[[functions]]
name = "test.fixture.wrap"
description = "Wrap the input in an object with its length"
output_default_root = "data"

[[functions.input_fields]]
name = "message"
kind = "any"
required = true
resolvable = true

[[functions]]
name = "test.fixture.upper"
description = "Upper-case the input text"

# A template field: the engine evaluates the expression the task wrote here
# and the guest receives the result.
[[functions.input_fields]]
name = "text"
kind = "string"
required = true
template_at = true

[[functions]]
name = "test.fixture.big-output"
description = "Return a string of the requested length"

[[functions.input_fields]]
name = "size"
kind = "number"
template_at = true

[[functions]]
name = "test.fixture.bad-json"
description = "Return text that is not JSON"

[[functions]]
name = "test.fixture.bad-code"
description = "Fail with a code outside the grammar"

[[functions]]
name = "test.fixture.caller-input-error"
description = "Fail blaming the caller"

[[functions]]
name = "test.fixture.internal-error"
description = "Fail blaming the plugin"
