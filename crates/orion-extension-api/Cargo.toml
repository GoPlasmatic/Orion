[package]
name = "orion-extension-api"
# No release cycle of its own: no tag names this crate. crates-publish.yml
# publishes it as a *rider*, right before orion-server (which depends on it),
# and the version is the workspace's, so a release always moves it.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "The extension surface of the Orion runtime: the channel driver, provider backend, pool cache and package verifier traits, their contract types, and the registration surface an edition composes a node with"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
readme = "README.md"
keywords = ["workflow", "runtime", "extension", "plugin", "connector"]
categories = ["api-bindings", "data-structures"]

[lints]
workspace = true

# Kept to what a trait signature names. Anything that would pull in a runtime
# (tokio, sqlx, axum, reqwest) belongs in orion-server, behind a trait here.
# orion-api is here for the wire types a contract shares with it: `Digest`
# (the CLI checks a digest the same way), `FieldError` (what a channel
# driver's validation answers, sent back as the admin API's error details),
# and the closed vocabularies the v2 wire carries too — `ImplementationKind`,
# `ConnectorErrorClass`, `EffectStatus`, `EditionTier` — defined there once
# and re-exported here. Its optional `utoipa` feature stays off.
[dependencies]
orion-api.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
