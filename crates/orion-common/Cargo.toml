[package]
name = "orion-common"
# No release cycle of its own: no tag names this crate. crates-publish.yml
# publishes it as a rider before the crates that depend on it, on the
# workspace's version.
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared primitives of the Orion runtime: configuration, the error type, crypto, metrics, request and trace context, canonical JSON and the egress body reader"
license.workspace = true
repository.workspace = true
homepage = "https://docs.goplasmatic.io/"
readme = "README.md"
keywords = ["workflow", "runtime", "configuration", "metrics"]
categories = ["config", "data-structures"]

[lints]
workspace = true

[features]
# The test helpers `orion-server`'s own unit tests call: `http_body::flood_server`
# and `assert_stopped_early`, `metrics::render_local`.
test-support = []

# The same requirements orion-server states, so the lockfile carries one copy
# of each.
[dependencies]
orion-api = { workspace = true, features = ["utoipa"] }
dataflow-rs = { version = "4.0.1", features = ["datetime", "budget"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
sqlx = { version = "0.9", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1"
thiserror = "2"
toml = { version = "1.1", default-features = false, features = ["parse", "display", "serde"] }
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
semver = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
ipnet = "2"
url = "2"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
rand = { version = "0.10", default-features = false, features = ["std", "std_rng", "thread_rng"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
aws-lc-rs = "1"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
dashmap = "6"
futures = { version = "0.3", default-features = false, features = ["alloc"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["rt-tokio", "trace"] }
tracing-opentelemetry = { version = "0.34", default-features = false }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
ctor = "1.0"
