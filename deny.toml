# cargo-deny configuration: advisories, license compatibility, bans and
# source policy for the full dependency tree.
# CI runs `cargo deny check` in the deny job; run it locally with:
#   cargo install cargo-deny --locked && cargo deny check

[graph]
# Orion has no features — check the tree exactly as it builds.
all-features = false
# Keep in step with dist-workspace.toml's `targets` plus the platforms
# CI qualifies for promotion (cross-os-build.yml). x86_64-apple-darwin was
# dropped from dist before ever shipping; musl is compiled on every
# relevant PR and staged to join the dist list.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # `astral-tokio-tar` is unmaintained. Dev-only: it is testcontainers'
    # tar reader, linked into no shipped binary, and testcontainers has no
    # release on another tar crate. Revisit with its next update.
    "RUSTSEC-2026-0440",
    # SQLite before 3.54.0 can return uninitialized page-cache memory when a
    # process opens a database and a sibling -wal file whose page size
    # differs. sqlx-sqlite 0.9.0 pins libsqlite3-sys < 0.38, so the patched
    # 0.39 is not selectable without forking sqlx. The attack needs a local
    # party already able to write the node's state files — the database's
    # own integrity boundary — and no request path controls either file.
    # Track sqlx's dependency bump under #389.
    "RUSTSEC-2026-0459",
]

[licenses]
version = 2
# Permissive licenses compatible with distributing an Apache-2.0 project
# as binaries and containers. Add here deliberately — no copyleft beyond
# the weak file-level MPL-2.0.
allow = [
    "Apache-2.0",
    # Wasmtime and Cranelift (the plugin sandbox): Apache-2.0 with the LLVM
    # exception, which only relaxes the attribution requirement for binaries.
    # A distinct SPDX expression, so the bare "Apache-2.0" entry does not
    # cover it. Allowed deliberately — see the docs site's concepts/plugins page.
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Owners and remaining version constraints are tracked in #389.
# The ~600-crate tree inevitably carries duplicate minor versions; a hard
# deny would be permanent noise. Wildcard requirements stay denied.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
