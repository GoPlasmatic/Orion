# Pinned for reproducibility; override with e.g. ORION_VERSION=1.0.0.
services:
  orion:
    image: ghcr.io/goplasmatic/orion:${ORION_VERSION:-1.6.0}
    ports:
      - "8080:8080"
    environment:
      ORION_STORAGE__URL: "sqlite:/app/data/orion.db"
      ORION_LOGGING__FORMAT: "pretty"
    volumes:
      - orion-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  orion-data:
